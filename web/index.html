<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>入群验证</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
    body {
      font: 16px system-ui;
      padding: 24px;
      margin: auto;
      max-width: 400px;
      color: var(--tg-theme-text-color, #222);
      background: var(--tg-theme-bg-color, #fff);
    }
    #message {
      line-height: 1.6;
    }
    button {
      padding: 10px 20px;
      margin-top: 16px;
    }
    </style>
  </head>
  <body>
<h2>入群验证</h2><p id="message">请完成验证，验证通过后将自动处理您的入群申请。</p>
<div id="challenge"></div><button id="retry" hidden>重新验证</button>
<script>
const app = window.Telegram?.WebApp;
const message = document.getElementById('message');
const retry = document.getElementById('retry');
let widget;
retry.onclick = () => { retry.hidden = true; turnstile.reset(widget); };
window.onTurnstile = () => {
  if (!app?.initData) { message.textContent = '请从 Telegram 中的专属验证链接打开本页面。'; return; }
  app.ready();
  widget = turnstile.render('#challenge', {
    sitekey: '__SITE_KEY__', action: 'join', cData: app.initDataUnsafe.start_param,
    callback: async token => {
      try {
        const response = await fetch('/verify', { method: 'POST', headers: {'Content-Type':'application/json', Authorization:'Telegram '+app.initData}, body:JSON.stringify({token}) });
        const result = await response.json();
        message.textContent = result.success ? '验证通过，正在处理，请返回群组查看。' : result.error;
        if (result.success) setTimeout(() => app.close(), 1200);
        else retry.hidden = false;
      } catch { message.textContent = '网络异常，请重试。'; retry.hidden = false; }
    },
    'expired-callback': () => { message.textContent = '验证码已过期，请重试。'; retry.hidden = false; },
    'error-callback': () => { message.textContent = '验证服务暂时不可用，请重试。'; retry.hidden = false; }
  });
};
</script>
<script src="https://challenges.cloudflare.com/turnstile/v0/api.js?onload=onTurnstile&render=explicit" async defer></script>
  </body>
</html>
